# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install all dependencies
      run: npm ci

    - name: Install Linux native bindings
      run: |
        ROLLDOWN_VERSION=$(node -p "require('./client/node_modules/rolldown/package.json').version")
        LIGHTNINGCSS_VERSION=$(node -p "require('./client/node_modules/lightningcss/package.json').version")
        npm install --no-save --workspace=client \
          "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
          "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"

    - name: Build client and server
      run: |
        npm run build --workspace=client --if-present
        npm run build --workspace=server --if-present

    - name: Run tests
      run: |
        npm test --workspace=client --if-present
        npm test --workspace=server --if-present
