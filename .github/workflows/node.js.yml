# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 1. This tells GitHub to run everything below twice (once for client, once for server)
        folder: [ 'gradflow/client', 'gradflow/server' ]
        # 2. Specifying a single stable Node version keeps your builds quick
        node-version: [ 20.x ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # 3. This points the cache explicitly to the right lock file location
        cache-dependency-path: '${{ matrix.folder }}/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: ${{ matrix.folder }}

    - name: Build project
      run: npm run build --if-present
      working-directory: ${{ matrix.folder }}

    - name: Run tests
      run: npm test --if-present
      working-directory: ${{ matrix.folder }}

